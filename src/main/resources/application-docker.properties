# Indicar a Spring que confíe en los encabezados del Proxy (Nginx/Docker)
server.forward-headers-strategy=native

# Cloudinary Configuration
cloudinary.url=${CLOUDINARY_URL}
# Limites de subida de archivos (Multipart)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Base de Datos
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Seguridad JWT (expiration: 15 minutos en ms)
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.token.expiration=${API_SECURITY_TOKEN_EXPIRATION}

# Forzar a Spring a ejecutar scripts SQL de inicialización (por defecto se busca el archivo data.sql) / Cambiar never por always
spring.sql.init.mode=never